fs
no-border 
save-position-on-quit = yes
screenshot-template = "%F - [%P]"
geometry = 50%:50%
autofit-larger = 50%x50%
sub-visibility = yes
sub-auto = fuzzy
# Subtitle font: Kaiti SC (Chinese brush style, ships with macOS). Kanji like 直 骨 角 use Chinese glyph forms.
sub-font = "Kaiti SC"
sub-font-size = 60
audio-file-auto = fuzzy
osc = no
osd-bar = no
border = no
# Homebrew's yt-dlp (Apple Silicon path) — so mpv can stream YouTube URLs.
script-opts=ytdl_hook-ytdl_path=/opt/homebrew/bin/yt-dlp
