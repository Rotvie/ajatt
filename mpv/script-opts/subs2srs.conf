# mpvacious settings — only what differs from, or matters beyond, upstream defaults.
# Anything not set here falls back to mpvacious's built-in defaults (config/defaults.lua).
# Full list of options: https://github.com/Ajatt-Tools/mpvacious/blob/master/config/default_config.conf
#
# Reloaded before every card (reload_config_before_card_creation), so edits apply without
# restarting mpv.

## Anki target — the note type in anki/note-types/sentence-mining-jp/
deck_name=Sentence Mining JP
model_name=Sentence Mining JP
ankiconnect_url=127.0.0.1:8765
create_deck=no
allow_duplicates=yes

## Fields mpvacious fills. Word, definition, furigana and pitch come from Yomitan (yomitan/).
sentence_field=SentKanji
# No English sentence field on this note type.
secondary_field=
audio_field=SentAudio
image_field=Image
vocab_field=VocabKanji
vocab_audio_field=VocabAudio
# Show / episode / timestamp. Source, not Notes, so Notes stays free for my own notes.
miscinfo_field=Source
miscinfo_enable=yes
miscinfo_format=%n EP%d (%t)
note_tag=subs2srs

## Yomitan hand-off
# Copy every subtitle to the clipboard as it appears; Yomitan's clipboard monitor picks it up.
autoclip=yes
autoclip_method=clipboard
# Spot a card Yomitan just added (sentence set, no media) and attach audio + screenshot.
enable_new_note_timer=yes
new_note_timer_interval_seconds=2
append_media=yes
nuke_spaces=yes

## Media
# avif, not webp: Homebrew's mpv/ffmpeg ship without a webp encoder, so webp silently yields
# no image. Anki desktop, AnkiMobile and AnkiDroid (Android 12+) all display avif.
snapshot_format=avif
snapshot_quality=15
snapshot_height=350
audio_format=opus
audio_bitrate=24k
# Added to BOTH ends: 0.5 = clip one second longer overall. Not applied to manual timings.
audio_padding=0.5
