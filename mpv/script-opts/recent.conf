# recent.lua - https://github.com/hacel/recent  (fetched by ../install.sh)
# display_bind is the key that opens the history menu.
# The default below is a Spanish-layout key - change it for your keyboard.
auto_save=yes
auto_run_idle=no
write_watch_later=yes
display_bind=ñ   # <- change for your keyboard layout
mouse_controls=yes
log_path=history.log
date_format=%d/%m/%y %X
show_paths=no
split_paths=yes
font_scale=50
border_size=0.7
hi_color=H46CFFF
ellipsis=no